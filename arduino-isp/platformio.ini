; ATtiny85 sketch upload via Nano-as-ISP.
;
; Workflow on a fresh ATtiny85:
;   1. Burn fuses (one-time per chip, sets internal clock to 8 MHz):
;        pio run -e attiny85 -t fuses
;   2. Upload sketch:
;        pio run -e attiny85 -t upload

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino
build_src_filter = -<*> +<blink.cpp>

; Fuses: internal 8 MHz, CKDIV8 disabled, RESET + SPI enabled (re-programmable).
; DO NOT change hfuse to clear bit 7 (RSTDISBL) or set bit 5 (SPIEN) — bricks ISP.
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; Programmer = Nano running ArduinoISP firmware, talking STK500v1 at 19200 baud.
; PlatformIO's built-in stk500v1 script ignores upload_port, so we drive avrdude
; ourselves with a custom upload command.
upload_protocol = custom
upload_port = /dev/cu.usbserial-110
upload_speed = 19200
upload_flags =
    -C${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -pattiny85
    -cstk500v1
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
upload_command = avrdude $UPLOAD_FLAGS -Uflash:w:$SOURCE:i

