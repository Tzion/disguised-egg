; ATtiny85 sketch — see README.md for prerequisites, wiring, fuse safety,
; and the build/upload workflow.

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; See README.md § "Fuses — don't touch hfuse bits 5 or 7" before changing.
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

upload_protocol = custom
upload_port = /dev/cu.usbserial-110
upload_speed = 19200
upload_flags =
    -C${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -pattiny85
    -cstk500v1
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
upload_command = avrdude $UPLOAD_FLAGS -Uflash:w:$SOURCE:i


; ATtiny84 target — LEDs only, no RTC. Same fuses & ISP flow, different chip
; and different pin layout. See color_drift.cpp for the ATtiny84 pin defs.
[env:attiny84]
platform = atmelavr
board = attiny84
framework = arduino
build_flags = -DNO_RTC

board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

upload_protocol = custom
upload_port = /dev/cu.usbserial-110
upload_speed = 19200
upload_flags =
    -C${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -pattiny84
    -cstk500v1
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
upload_command = avrdude $UPLOAD_FLAGS -Uflash:w:$SOURCE:i
