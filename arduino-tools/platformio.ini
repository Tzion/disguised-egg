; Sketches flashed directly onto the Arduino Nano (over USB).
;
; Each env corresponds to ONE role the Nano can play. Pick a role and flash:
;   pio run -e isp_firmware -t upload   → makes the Nano an ISP programmer for AVR chips
;   pio run -e rtc_reader   -t upload   → makes the Nano read time from a DS3231 over I2C
;
; Reminder: REMOVE the 10 uF cap from Nano RESET<->GND before flashing any of these
; (the cap blocks the auto-reset that the bootloader needs). Re-install the cap
; afterwards ONLY when using the isp_firmware role to flash an ATtiny.

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600

[env:isp_firmware]
build_src_filter = -<*> +<ArduinoISP.cpp>

[env:rtc_reader]
build_src_filter = -<*> +<rtc_reader.cpp>
monitor_speed = 9600
lib_deps = adafruit/RTClib@^2.1.4
